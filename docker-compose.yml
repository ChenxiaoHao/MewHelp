services:
  mysql:
    image: mysql:8.0
    container_name: mewhelp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mewhelp_dev
      MYSQL_DATABASE: mewhelp
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"  # 本机原生 MySQL 服务占用 3306，宿主侧改用 3307（.env MYSQL_PORT 同步）
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Windows bind-mount 的 cnf 是 0777 会被 mysql 客户端忽略，无法用客户端配置修字符集；
      # 改为服务端忽略客户端字符集声明，强制所有连接（含 initdb 执行 .sql 的客户端）用 utf8mb4，
      # 否则 UTF-8 的 init SQL 会被 latin1 客户端双重编码入库。
      - --skip-character-set-client-handshake
    volumes:
      - mewhelp_mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pmewhelp_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- ch03: Milvus standalone(镜像/命令/健康检查逐字抄官方 v3.0.0 compose;
  #     差异仅两处:bind-mount 卷改 named volume;minio 的 9000/9001 宿主端口不暴露,仅走内部网络) ---
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: milvus-standalone
    image: milvusdb/milvus:v3.0.0
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"

volumes:
  mewhelp_mysql_data:
  etcd-data:
  minio-data:
  milvus-data:
