[project]
name = "mewhelp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiomysql>=0.3.2",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "langchain>=1.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-openai>=1.6.2",
    "langfuse>=4.16.0",
    "mcp>=1.30.0",
    "pydantic-settings>=2.15.0",
    "pymilvus>=3.0.2",
    "scikit-learn>=1.9.1",
    "sqlalchemy[asyncio]>=2.0.54",
    "torch>=2.14.1",
    "transformers>=5.18.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

# torch 走 PyTorch 官方 CUDA 索引(PyPI 轮子为 CPU 构建);其余仍走 PyPI
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-m", "not integration"]
markers = [
    "integration: 需要活的 Milvus/MySQL/DashScope 环境,默认跳过,uv run pytest -m integration 单跑",
]
