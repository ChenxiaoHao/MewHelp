<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>喵帮客服 · MewHelp</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; background: #f3f4f6; height: 100vh; display: flex; }
  /* 左侧聊天区 */
  #chat-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { padding: 14px 20px; background: #fff; border-bottom: 1px solid #e5e7eb; font-weight: 600; }
  header small { color: #9ca3af; font-weight: 400; margin-left: 8px; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  .bubble { max-width: 72%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; background: #6366f1; color: #fff; border-bottom-right-radius: 4px; }
  .assistant { align-self: flex-start; background: #fff; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
  .error { align-self: center; background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; font-size: 13px; }
  #input-bar { display: flex; gap: 10px; padding: 14px 20px; background: #fff; border-top: 1px solid #e5e7eb; }
  #input { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; outline: none; }
  #input:focus { border-color: #6366f1; }
  button { padding: 10px 18px; border: none; border-radius: 8px; background: #6366f1; color: #fff; font-size: 14px; cursor: pointer; }
  button:disabled { background: #c7d2fe; cursor: not-allowed; }
  /* 右侧售后提取面板 */
  #extract-panel { width: 340px; background: #fff; border-left: 1px solid #e5e7eb; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
  #extract-panel h2 { font-size: 15px; }
  #extract-panel textarea { flex: 0 0 140px; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px; resize: vertical; }
  #extract-result { flex: 1; background: #0f172a; color: #7dd3fc; border-radius: 8px; padding: 12px; font-size: 12px; font-family: Consolas, monospace; overflow: auto; white-space: pre-wrap; min-height: 120px; }
</style>
</head>
<body>

<div id="chat-panel">
  <header>🐱 喵帮智能客服 <small>SSE 流式 · 多轮上下文</small></header>
  <div id="messages"></div>
  <div id="input-bar">
    <input id="input" placeholder="请输入您的问题，Enter 发送…" autocomplete="off">
    <button id="send-btn">发送</button>
  </div>
</div>

<div id="extract-panel">
  <h2>📋 售后信息结构化提取</h2>
  <textarea id="extract-input" placeholder="贴入售后描述，例如：&#10;订单 DD20260901001 的耳机右声道没声音，才买一周，我要退货退款。"></textarea>
  <button id="extract-btn">提取 JSON</button>
  <pre id="extract-result">（提取结果将显示在这里）</pre>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');

// 多轮上下文：历史存 JS 内存，随每次请求携带
const history = [];

function addBubble(cls, text) {
  const div = document.createElement('div');
  div.className = 'bubble ' + cls;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  sendBtn.disabled = true;
  addBubble('user', text);
  history.push({ role: 'user', content: text });

  const bubble = addBubble('assistant', '');
  let answer = '';
  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history }),
    });
    if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);

    // 读 SSE 流：按空行切帧，解析 event:/data: 行
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const frames = buf.split(/\r?\n\r?\n/);
      buf = frames.pop();
      for (const frame of frames) {
        let event = 'message';
        const dataLines = [];
        for (const line of frame.split(/\r?\n/)) {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
        }
        if (!dataLines.length) continue;
        const data = dataLines.join('\n');
        if (event === 'token') {
          answer += JSON.parse(data);   // data 是 JSON 字符串化的增量文本
          bubble.textContent = answer;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        } else if (event === 'error') {
          throw new Error(JSON.parse(data).detail || '上游错误');
        }
        // event === 'done' → 流结束，跳出读循环
      }
    }
    if (answer) history.push({ role: 'assistant', content: answer });
    else bubble.remove();
  } catch (err) {
    bubble.remove();
    addBubble('error', '⚠ ' + err.message);
    history.pop();  // 失败的用户消息不入历史
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });

// 售后提取面板
document.getElementById('extract-btn').addEventListener('click', async () => {
  const desc = document.getElementById('extract-input').value.trim();
  const out = document.getElementById('extract-result');
  if (!desc) { out.textContent = '请先输入售后描述'; return; }
  out.textContent = '提取中…';
  try {
    const resp = await fetch('/api/extract', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: desc }),
    });
    const body = await resp.json();
    out.textContent = JSON.stringify(body, null, 2);
  } catch (err) {
    out.textContent = '请求失败: ' + err.message;
  }
});
</script>
</body>
</html>
