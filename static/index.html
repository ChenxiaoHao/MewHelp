<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FF9B50">
<title>小喵 · 智能客服 | MewHelp</title>
<style>
  /* ===== 复古像素调色板（4~6 色） ===== */
  :root {
    --bg: #F6D89C;      /* 页面米黄 */
    --win: #FFF8E8;     /* 窗口米白 */
    --paper: #FFFDF5;   /* 输入纸面 */
    --orange: #FF9B50;  /* 主题橙 */
    --ink: #292929;     /* 深色边框/文字 */
    --aux: #E8DCC5;     /* 辅助米色 */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: var(--ink);
    /* 米黄底 + 细方格网格（复古游戏地图/工程纸） */
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(41,41,41,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(41,41,41,.07) 1px, transparent 1px);
    background-size: 24px 24px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .mono { font-family: Consolas, "Courier New", monospace; }

  /* ===== 中央客服窗口 ===== */
  .window {
    width: 760px; max-width: 100%;
    height: 740px; max-height: calc(100dvh - 48px);
    background: var(--win);
    border: 3px solid var(--ink);
    border-radius: 6px;
    box-shadow: 6px 6px 0 var(--ink);   /* 偏移阴影，复古立体感 */
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* ===== 顶部 Header（橙色标题栏） ===== */
  header {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    background: var(--orange);
    border-bottom: 3px solid var(--ink);
  }
  .avatar-lg {
    width: 38px; height: 38px; flex: 0 0 auto;
    background: var(--win);
    border: 3px solid var(--ink); border-radius: 4px;
    box-shadow: 2px 2px 0 var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .avatar-lg .cat { width: 24px; height: 24px; }
  .title-block { flex: 1; min-width: 0; }
  .title-block h1 {
    font-size: 16px; letter-spacing: 1px; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status { font-size: 10px; letter-spacing: .5px; opacity: .85; white-space: nowrap; }
  .status .dot { animation: blink 1.2s step-end infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .header-btns { display: flex; gap: 6px; flex: 0 0 auto; }

  /* ===== 复古像素按钮 ===== */
  .btn {
    font: inherit; font-weight: 700; color: var(--ink);
    background: var(--orange);
    border: 3px solid var(--ink); border-radius: 4px;
    box-shadow: 3px 3px 0 var(--ink);
    padding: 6px 14px; cursor: pointer;
  }
  .btn:hover:not(:disabled) { filter: brightness(1.05); }
  .btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
  .btn:disabled {
    background: var(--aux); color: #8a806c; cursor: not-allowed;
    border-color: rgba(41,41,41,.55); box-shadow: 3px 3px 0 rgba(41,41,41,.4);
  }
  .btn-sm {
    padding: 4px 8px; font-size: 12px;
    border-width: 2px; border-radius: 3px;
    background: var(--win); box-shadow: 2px 2px 0 var(--ink);
  }
  .btn-sm:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  a.btn { text-decoration: none; }   /* ch04 T14:顶栏「忠实度台账」入口(链接套按钮皮) */

  /* ===== ch07(T10): 多会话侧栏 ===== */
  .chat-layout { flex: 1 1 auto; display: flex; min-height: 0; }
  .chat-main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
  #sidebar {
    flex: 0 0 190px; display: flex; flex-direction: column; min-height: 0;
    background: var(--aux); border-right: 3px solid var(--ink);
  }
  .sb-head {
    flex: 0 0 auto; padding: 6px 8px; font-size: 11px; letter-spacing: 1px;
    background: var(--win); border-bottom: 2px solid var(--ink);
  }
  #conv-list { flex: 1 1 auto; overflow-y: auto; }
  .conv-item {
    padding: 7px 8px; font-size: 11px; line-height: 1.45; cursor: pointer;
    border-bottom: 2px solid rgba(41,41,41,.25); word-break: break-all;
  }
  .conv-item:hover { background: rgba(255,155,80,.25); }
  .conv-item.active { background: var(--orange); }
  .conv-item .ci-id { opacity: .65; }
  .conv-item .ci-sum { font-size: 10px; opacity: .8; }
  .sb-note {
    flex: 0 0 auto; display: none; padding: 6px 8px; font-size: 10px;
    background: var(--win); border-top: 2px solid var(--ink);
  }
  .sb-note.show { display: block; }

  /* ===== 聊天消息区域 ===== */
  #messages {
    flex: 1 1 auto; overflow-y: auto;
    padding: 16px 14px;
    display: flex; flex-direction: column; gap: 14px;
    background: var(--win);
  }
  #messages::-webkit-scrollbar { width: 10px; }
  #messages::-webkit-scrollbar-track { background: var(--aux); }
  #messages::-webkit-scrollbar-thumb { background: var(--ink); border: 2px solid var(--aux); }

  .msg { display: flex; gap: 8px; align-items: flex-end; }
  .msg.user { justify-content: flex-end; }
  .msg.error { justify-content: center; }
  /* ch07(T10) 回载:tool 行/纯 tool_calls 中间行=一行浅色 🔧 标识,不占气泡 */
  .msg.toolline { justify-content: flex-start; }
  .msg.toolline .bubble {
    font-size: 11px; color: #8a806c; background: var(--aux);
    border-width: 2px; box-shadow: none; padding: 3px 8px;
  }
  .avatar {
    width: 28px; height: 28px; flex: 0 0 auto;
    background: var(--win);
    border: 2px solid var(--ink); border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
  }
  .avatar .cat { width: 18px; height: 18px; }
  .bubble {
    max-width: 78%;
    padding: 9px 12px;
    border: 3px solid var(--ink); border-radius: 4px;  /* 轻微圆角，偏像素 UI */
    box-shadow: 3px 3px 0 var(--ink);
    font-size: 14px; line-height: 1.65;
    white-space: pre-wrap;            /* 保留换行 */
    word-break: break-word;           /* 长文本不撑破窗口 */
    overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: var(--orange); }
  .msg.assistant .bubble { background: var(--aux); }
  .msg.error .bubble {
    background: var(--ink); color: var(--win);
    box-shadow: 3px 3px 0 var(--orange);
    font-size: 13px; max-width: 90%;
  }
  /* 流式输出时的像素光标 */
  .bubble.typing::after { content: "▌"; margin-left: 1px; animation: blink .8s step-end infinite; }

  /* ch02: 消息列（徽章+气泡纵向排列）与工具徽章（像素风：2px 墨线边框 + 橙底小方块） */
  .msg-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .tool-badge {
    align-self: flex-start;
    font-size: 11px;
    line-height: 1.4;
    padding: 2px 6px;
    background: #FF9B50;
    color: #292929;
    border: 2px solid #292929;
    box-shadow: 2px 2px 0 rgba(41, 41, 41, .35);
    white-space: nowrap;
  }
  .tool-badge.pending { background: #F6D89C; }
  .tool-badge.fail { background: #E8DCC5; }

  /* ===== ch05(T8): suggestions 帧操作建议行(转人工/建工单两独立按钮) ===== */
  .sug-row { display: flex; align-items: center; gap: 8px; align-self: flex-start; margin-top: 2px; flex-wrap: wrap; }
  .sug-note { font-size: 10px; letter-spacing: 1px; color: #8a7c60; }
  .sug-btn {
    padding: 3px 10px; font-size: 12px; line-height: 1.4;
    background: var(--win);
    border-width: 2px; border-radius: 3px; box-shadow: 2px 2px 0 var(--ink);
  }
  .sug-btn.picked { background: var(--orange); }

  /* ===== ch06(T6): orders 帧订单卡片 + refund_apply 轻表单 ===== */
  .order-row { display: flex; gap: 10px; align-self: stretch; flex-wrap: wrap; margin-top: 4px; }
  .order-card {
    flex: 0 1 210px; display: flex; flex-direction: column; gap: 4px;
    padding: 8px 10px; background: var(--win); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 4px;
    box-shadow: 3px 3px 0 rgba(41, 41, 41, .35);
    font-size: 12px; line-height: 1.45;
  }
  .order-card .oc-id { font-weight: 700; font-size: 13px; }
  .order-card .oc-items { color: #6b5f47; font-size: 11px; }
  .order-card.picked { background: var(--orange); box-shadow: 3px 3px 0 var(--ink); }
  .order-pick-btn { align-self: flex-start; padding: 2px 10px; font-size: 12px; }
  .refund-form {
    display: flex; flex-direction: column; gap: 6px; align-self: flex-start;
    margin-top: 6px; padding: 10px 12px; background: var(--win); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 4px;
    box-shadow: 3px 3px 0 rgba(41, 41, 41, .35); font-size: 12px;
  }
  .refund-form label { display: flex; align-items: center; gap: 8px; }
  .refund-form input, .refund-form select {
    font: inherit; font-size: 12px; padding: 3px 6px;
    background: var(--paper); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 3px;
  }
  .refund-bar { display: flex; gap: 8px; margin-top: 2px; }

  /* ===== 输入区域 ===== */
  #input-bar {
    flex: 0 0 auto; display: flex; gap: 10px;
    padding: 10px 12px;
    background: var(--aux);
    border-top: 3px solid var(--ink);
  }
  #input {
    flex: 1; min-width: 0; height: 46px;
    padding: 0 12px;
    font: inherit; font-size: 14px; color: var(--ink);
    background: var(--paper);
    border: 3px solid var(--ink); border-radius: 4px;
    outline: none;
  }
  #input:focus { box-shadow: 3px 3px 0 var(--orange); }  /* 聚焦：简单明显的反馈 */
  #send-btn { width: 78px; height: 46px; padding: 0; font-size: 16px; line-height: 1; white-space: nowrap; }

  /* ===== 底部小字提示 ===== */
  footer.hint {
    flex: 0 0 auto;
    padding: 5px 8px;
    text-align: center;
    font-size: 10px; letter-spacing: .5px;
    color: #8a7c60;
    background: var(--win);
    border-top: 2px dashed rgba(41,41,41,.3);
  }

  /* ===== 售后提取 · 复古弹窗 ===== */
  .overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(41,41,41,.55);
    display: none; align-items: center; justify-content: center;
    padding: 16px;
  }
  .overlay.open { display: flex; }
  .modal {
    width: 430px; max-width: 100%;
    max-height: calc(100dvh - 32px);
    background: var(--win);
    border: 3px solid var(--ink); border-radius: 6px;
    box-shadow: 6px 6px 0 var(--ink);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .modal-header {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 12px;
    background: var(--orange);
    border-bottom: 3px solid var(--ink);
    font-weight: 700; font-size: 14px; letter-spacing: 1px;
  }
  #extract-close { width: 26px; height: 26px; padding: 0; font-size: 13px; line-height: 1; }
  .modal-body {
    padding: 12px;
    display: flex; flex-direction: column; gap: 10px;
    overflow-y: auto;
  }
  .modal-body label { font-size: 12px; font-weight: 700; }
  #extract-input {
    width: 100%; min-height: 110px; resize: vertical;
    padding: 10px;
    font: inherit; font-size: 13px; color: var(--ink);
    background: var(--paper);
    border: 3px solid var(--ink); border-radius: 4px;
    outline: none;
  }
  #extract-input:focus { box-shadow: 3px 3px 0 var(--orange); }
  /* 复古终端风 JSON 结果 */
  #extract-result {
    min-height: 120px; max-height: 240px; overflow: auto;
    padding: 10px 12px;
    background: var(--ink); color: var(--bg);
    border: 3px solid var(--ink); border-radius: 4px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
  }

  /* ===== ch04: 引用角标 + 👍/👎 反馈行 + 原文弹窗(全部复用既有调色板,零新依赖) ===== */
  sup.cite {
    font-size: 10px; line-height: 1; cursor: pointer; user-select: none;
    margin: 0 1px; padding: 0 3px;
    background: var(--orange); color: var(--ink);
    border: 2px solid var(--ink); border-radius: 2px;
    box-shadow: 1px 1px 0 var(--ink);
  }
  sup.cite:hover { filter: brightness(1.08); }
  .fb-row { display: flex; align-items: center; gap: 6px; align-self: flex-start; margin-top: 2px; }
  .fb-btn {
    padding: 1px 7px; font-size: 13px; line-height: 1.3;
    background: var(--win);
    border-width: 2px; border-radius: 3px; box-shadow: 2px 2px 0 var(--ink);
  }
  .fb-btn.on { background: var(--orange); }   /* 被点钮点亮 */
  .fb-note { font-size: 10px; letter-spacing: 1px; color: #8a7c60; }
  #cite-breadcrumb { font-size: 12px; font-weight: 700; line-height: 1.5; word-break: break-word; }
  #cite-questions {
    font-size: 12px; color: #6b5f49; line-height: 1.6;
    padding: 6px 8px; background: var(--aux);
    border: 2px dashed rgba(41,41,41,.35); border-radius: 3px;
  }
  #cite-answer {
    min-height: 80px; max-height: 320px; overflow: auto;
    padding: 10px 12px;
    background: var(--paper); color: var(--ink);
    border: 3px solid var(--ink); border-radius: 4px;
    font-size: 13px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-word;
  }
  .cite-nav { display: flex; gap: 8px; }

  /* ===== 移动端自适应 ===== */
  @media (max-width: 560px) {
    body { padding: 0; display: block; }
    .window {
      width: 100vw;
      height: 100vh; height: 100dvh;
      max-height: none;
      border: 0; border-radius: 0; box-shadow: none;  /* 隐藏装饰 */
    }
    .title-block h1 { font-size: 14px; }
    .avatar-lg { width: 34px; height: 34px; }
    .avatar-lg .cat { width: 20px; height: 20px; }
    .bubble { max-width: 84%; }
    .modal { width: calc(100vw - 32px); }
  }
</style>
</head>
<body>

<!-- 像素猫图标（symbol 定义，页面内复用） -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="cat-icon" viewBox="0 0 8 8">
    <g shape-rendering="crispEdges">
      <rect x="0" y="0" width="1" height="1" fill="#292929"/>
      <rect x="7" y="0" width="1" height="1" fill="#292929"/>
      <rect x="0" y="1" width="2" height="1" fill="#292929"/>
      <rect x="6" y="1" width="2" height="1" fill="#292929"/>
      <rect x="0" y="2" width="8" height="1" fill="#292929"/>
      <rect x="0" y="3" width="1" height="1" fill="#292929"/>
      <rect x="1" y="3" width="2" height="1" fill="#FFF8E8"/>
      <rect x="3" y="3" width="2" height="1" fill="#292929"/>
      <rect x="5" y="3" width="2" height="1" fill="#FFF8E8"/>
      <rect x="7" y="3" width="1" height="1" fill="#292929"/>
      <rect x="0" y="4" width="8" height="1" fill="#292929"/>
      <rect x="0" y="5" width="3" height="1" fill="#292929"/>
      <rect x="3" y="5" width="2" height="1" fill="#FF9B50"/>
      <rect x="5" y="5" width="3" height="1" fill="#292929"/>
      <rect x="0" y="6" width="8" height="1" fill="#292929"/>
      <rect x="1" y="7" width="6" height="1" fill="#292929"/>
    </g>
  </symbol>
</svg>

<!-- 中央客服窗口 -->
<div class="window">
  <header>
    <div class="avatar-lg"><svg class="cat" aria-hidden="true"><use href="#cat-icon"></use></svg></div>
    <div class="title-block">
      <h1>小喵 · 智能客服</h1>
      <div class="status mono"><span class="dot">●</span> ONLINE · 智能客服</div>
    </div>
    <div class="header-btns">
      <a id="faith-link" class="btn btn-sm" href="/static/faith.html" title="faith_cases 忠实度台账(ch04)">📜 忠实度台账</a>
      <button id="extract-open-btn" class="btn btn-sm" title="售后信息结构化提取">🔧 售后提取</button>
      <button id="new-chat-btn" class="btn btn-sm" title="清空聊天记录，重新开始">＋ 新对话</button>
    </div>
  </header>

  <div class="chat-layout">
    <aside id="sidebar" class="mono" aria-label="会话列表">
      <div class="sb-head">▤ 会话列表</div>
      <div id="conv-list"></div>
      <div id="sb-note" class="sb-note"></div>
    </aside>
    <div class="chat-main">
      <div id="messages"></div>

      <div id="input-bar">
        <input id="input" placeholder="请输入您的问题，Enter 发送…" autocomplete="off">
        <button id="send-btn" class="btn" aria-label="发送" title="发送">▶ 发送</button>
      </div>

      <footer class="hint mono">ENTER 发送 · 服务端三层上下文(ch07) · SSE STREAMING</footer>
    </div>
  </div>
</div>

<!-- 售后提取 · 复古弹窗 -->
<div class="overlay" id="extract-overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="extract-title">
    <div class="modal-header">
      <span id="extract-title">📋 售后工单 · 结构化提取</span>
      <button id="extract-close" class="btn btn-sm" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body">
      <label for="extract-input">售后描述</label>
      <textarea id="extract-input" placeholder="贴入售后描述，例如：&#10;订单 DD20260901001 的耳机右声道没声音，才买一周，我要退货退款。"></textarea>
      <button id="extract-btn" class="btn">提取 JSON</button>
      <label class="mono" for="extract-result">&gt; extract_result.json</label>
      <pre id="extract-result">（提取结果将显示在这里）</pre>
    </div>
  </div>
</div>

<!-- ch04: 引用原文弹窗(仿售后提取 overlay 基调,T13 Step 2) -->
<div class="overlay" id="cite-overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="cite-title">
    <div class="modal-header">
      <span id="cite-title">📚 KB 原文回查</span>
      <button id="cite-close" class="btn btn-sm" aria-label="关闭">✕</button>
    </div>
    <div class="modal-body">
      <div id="cite-breadcrumb" class="mono"></div>
      <label>常见问法</label>
      <div id="cite-questions"></div>
      <label for="cite-answer">原文正文</label>
      <pre id="cite-answer">（加载中…）</pre>
      <div class="cite-nav" style="display:flex;gap:8px;">
        <button id="cite-prev" class="btn btn-sm">◀ 上一块</button>
        <button id="cite-next" class="btn btn-sm">下一块 ▶</button>
      </div>
    </div>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const overlay = document.getElementById('extract-overlay');

// 多轮上下文：历史存 JS 内存，随每次请求携带（数据结构与后端契约不变）
const history = [];

// ch02: 服务端会话 id（conversation 帧存值；「＋新对话」置 null；null 时请求体省略该字段）
let conversationId = null;

const GREETING = '喵~ 我是小喵，本店智能客服。\n退换货、订单、售后问题都可以问我，回复会逐字流式显示哦 ✦';

function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

// 创建一条消息行；assistant 带像素猫头像。返回 { row, bubble, col }，
// row 用于整行移除（含头像），bubble 用于流式更新文本，col 用于挂工具徽章（ch02）。
function addMessage(cls, text) {
  const row = document.createElement('div');
  row.className = 'msg ' + cls;
  if (cls === 'assistant') {
    const av = document.createElement('div');
    av.className = 'avatar';
    av.innerHTML = '<svg class="cat" aria-hidden="true"><use href="#cat-icon"></use></svg>';
    row.appendChild(av);
  }
  const col = document.createElement('div');
  col.className = 'msg-col';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  col.appendChild(bubble);
  row.appendChild(col);
  messagesEl.appendChild(row);
  scrollBottom();
  return { row, bubble, col };
}

// ch02: 工具徽章（像素风小方块，挂当前 AI 气泡上方；同轮多工具多徽章）
function addToolBadge(col, name) {
  const b = document.createElement('div');
  b.className = 'tool-badge pending';
  b.textContent = '🔧 ' + name + ' 调用中…';
  col.insertBefore(b, col.firstChild);
  scrollBottom();
  return b;
}

// 新对话：清空 history 与页面消息，重新开始
function resetChat() {
  history.length = 0;
  conversationId = null;  // ch02: 新对话 → 服务端开新会话行
  messagesEl.innerHTML = '';
  addMessage('assistant', GREETING);  // 欢迎语仅展示用，不入 history（后端有自己的 System Prompt）
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  sendBtn.disabled = true;
  addMessage('user', text);
  history.push({ role: 'user', content: text });

  const { row, bubble, col } = addMessage('assistant', '');
  bubble.classList.add('typing');
  const badges = {};  // ch02: tool_call id → 徽章元素
  let answer = '';
  let roundCitations = null;  // ch04(T13): 本轮 tool_result 帧 citations 暂存(同轮多次 query_faq 后帧覆盖前帧,见 dev-notes)
  let roundSuggestions = null;  // ch05(T8): suggestions 帧暂存(末 token 后、done 前到达=RF4)
  let roundOrders = null;       // ch06(T6): orders 帧暂存(suggestions 前到达=P7 帧序)
  try {
    const resp = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(
        conversationId == null
          ? { messages: history }
          : { messages: history, conversation_id: conversationId }
      ),
    });
    if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);

    // 读 SSE 流：按空行切帧，解析 event:/data: 行
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const frames = buf.split(/\r?\n\r?\n/);
      buf = frames.pop();
      for (const frame of frames) {
        let event = 'message';
        const dataLines = [];
        for (const line of frame.split(/\r?\n/)) {
          if (line.startsWith('event:')) event = line.slice(6).trim();
          else if (line.startsWith('data:')) dataLines.push(line.slice(5).trim());
        }
        if (!dataLines.length) continue;
        const data = dataLines.join('\n');
        if (event === 'token') {
          answer += JSON.parse(data);   // data 是 JSON 字符串化的增量文本
          bubble.textContent = answer;  // 实时逐块显示，不等完整回答
          scrollBottom();               // 自动滚动到底部
        } else if (event === 'conversation') {
          conversationId = JSON.parse(data).conversation_id;
        } else if (event === 'tool_call') {
          const tc = JSON.parse(data);
          badges[tc.id] = addToolBadge(col, tc.name);
        } else if (event === 'tool_result') {
          const tr = JSON.parse(data);
          const badge = badges[tr.id];
          if (badge) {
            badge.classList.remove('pending');
            badge.classList.add(tr.ok ? 'ok' : 'fail');
            badge.textContent = (tr.ok ? '✓ ' : '✗ ') + tr.name;
            badge.title = tr.summary || '';  // 悬停看摘要
          }
          if (tr.citations && tr.citations.length) roundCitations = tr.citations;  // ch04(T13): 分支内加性暂存,帧处理逻辑零变更
        } else if (event === 'orders') {
          roundOrders = JSON.parse(data).items || [];  // ch06(T6): 订单选择卡片,只暂存
        } else if (event === 'suggestions') {
          roundSuggestions = JSON.parse(data).items || [];  // ch05(T8): 只暂存,渲染在流收尾后
        } else if (event === 'error') {
          throw new Error(JSON.parse(data).detail || '上游错误');
        }
        // event === 'done' → 流结束，跳出读循环
      }
    }
    if (answer) {
      history.push({ role: 'assistant', content: answer });
      // ch04(T13): 最终答案渲染后处理——[n]→可点角标(仅本轮带 citations 时),气泡左下 👍/👎
      renderAnswerCitations(bubble, roundCitations);
      addFeedbackRow(col, assistantSeqFromHistory());
      if (roundOrders && roundOrders.length)
        addOrderCards(col, roundOrders);                        // ch06(T6): 卡片先于建议钮(帧序一致)
      if (roundSuggestions && roundSuggestions.length)
        addSuggestionRow(col, roundSuggestions, text, answer);  // ch05(T8): 操作建议行
    } else row.remove();
  } catch (err) {
    row.remove();
    addMessage('error', '⚠ ' + err.message);  // 复古风错误提示（深底米字）
    history.pop();  // 失败的用户消息不入历史
  } finally {
    bubble.classList.remove('typing');
    sendBtn.disabled = false;
    inputEl.focus();
    loadConversations();   // ch07(T10): 首轮建会话/摘要标记变化→轮末刷列表(失败自静默)
  }
}

sendBtn.addEventListener('click', send);

inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) send(); });

async function loadConversations() {

function renderReloaded(rows) {         // 回载渲染:user/assistant 气泡;tool 行与
  messagesEl.innerHTML = '';            // 无正文纯 tool_calls 中间行=一行浅色 🔧 标识
  for (const m of rows) {
    if (m.role === 'user') {
      addMessage('user', m.content || '');
    } else if (m.role === 'assistant') {
      if (m.content) {
        const { col } = addMessage('assistant', m.content);
        for (const tc of (m.tool_calls || [])) {
          const b = document.createElement('div');
          b.className = 'tool-badge';
          b.textContent = '🔧 ' + (tc.name || 'tool');
          b.title = JSON.stringify(tc.args || {});
          col.insertBefore(b, col.firstChild);
        }
      } else if (m.tool_calls && m.tool_calls.length) {
        addMessage('toolline', '🔧 ' + m.tool_calls.map(t => t.name || 'tool').join(' + '));
      }
    } else if (m.role === 'tool') {
      addMessage('toolline', '🔧 工具回执 ' + String(m.content || '').slice(0, 40));
    }
  }
  scrollBottom();
}

async function switchConversation(cid) {
  if (cid === conversationId || sendBtn.disabled) return;   // 流未结束禁切换(订单卡同款闸)
  try {
    const resp = await fetch('/api/conversations/' + cid + '/messages');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const rows = await resp.json();
    conversationId = cid;               // 整体换轨:新 id + 新本地数组,续聊走既有 send 面
    history.length = 0;
    history.push(...rows
      .filter(m => (m.role === 'user' || m.role === 'assistant') && m.content)
      .map(m => ({ role: m.role, content: m.content })));
    renderReloaded(rows);
    refreshConvActive();
    sbNote('');
  } catch (err) {
    sbNote('⚠ 回载失败,可继续当前对话');  // 不挡聊天、不换轨
  }
}

convListEl.addEventListener('click', e => {   // 事件委托(角标同款,不逐行挂监听)
  const item = e.target.closest('.conv-item');
  if (item) switchConversation(parseInt(item.dataset.cid, 10));
});

// ===== ch04(T13) ①引用角标:[n] → <sup class="cite" data-cid> =====
function assistantSeqFromHistory() {
  return history.filter(m => m.role === 'assistant').length;  // seq=本会话第几条 assistant 消息
}
function citationSegments(text, citations) {
  const byN = {};
  (citations || []).forEach(c => {
    if (c && typeof c.n === 'number' && c.chunk_id != null) byN[c.n] = c.chunk_id;
  });
  const segs = [];
  let last = 0, m;
  const re = /\[(\d+)\]/g;
  while ((m = re.exec(text))) {
    const n = parseInt(m[1], 10);
    if (!(n in byN)) continue;            // n 不在 citations → 保留原文不渲染角标(防模型错标)
    if (m.index > last) segs.push({ t: 'text', v: text.slice(last, m.index) });
    segs.push({ t: 'cite', n, cid: byN[n] });
    last = m.index + m[0].length;
  }
  if (last < text.length) segs.push({ t: 'text', v: text.slice(last) });
  return segs;
}
function renderAnswerCitations(bubble, citations) {
  if (!citations || !citations.length) return;      // 无 citations(拒答/旧帧)→ 原样 textContent,零变更
  const segs = citationSegments(bubble.textContent, citations);
  if (!segs.some(s => s.t === 'cite')) return;      // 全是错标 [n] → 不动原文、不抛错
  const frag = document.createDocumentFragment();
  for (const s of segs) {
    if (s.t === 'text') { frag.appendChild(document.createTextNode(s.v)); continue; }
    const sup = document.createElement('sup');
    sup.className = 'cite';
    sup.dataset.cid = String(s.cid);
    sup.textContent = '[' + s.n + ']';
    sup.title = '点击查看 KB 原文';
    frag.appendChild(sup);
  }
  bubble.textContent = '';
  bubble.appendChild(frag);
}

// ===== ch04(T13) ②👍/👎 一次性锁定(localStorage 纯前端,零后端请求;key=数据飞轮读侧约定) =====
const FEEDBACK_PREFIX = 'mewhelp.feedback.v1';
function feedbackKey(convId, seq) { return FEEDBACK_PREFIX + ':' + convId + ':' + seq; }
function readFeedback(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return null;
    const e = JSON.parse(raw);
    return (e && (e.v === 'up' || e.v === 'down')) ? e : null;
  } catch (err) { return null; }
}
function addFeedbackRow(col, seq) {
  const rowEl = document.createElement('div');
  rowEl.className = 'fb-row';
  const key = feedbackKey(conversationId, seq);
  const mk = v => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn btn-sm fb-btn';
    b.dataset.v = v;
    b.textContent = v === 'up' ? '👍' : '👎';
    return b;
  };
  const up = mk('up'), down = mk('down');
  const note = document.createElement('span');
  note.className = 'fb-note mono';
  rowEl.appendChild(up); rowEl.appendChild(down); rowEl.appendChild(note);
  function lock(entry) {                       // 两钮禁用、被点钮点亮、旁边「已反馈」
    up.disabled = true; down.disabled = true;
    (entry.v === 'up' ? up : down).classList.add('on');
    note.textContent = '已反馈';
    up.title = down.title = '该回答已反馈';
  }
  const cached = readFeedback(key);            // 历史渲染时按 key 回显锁定态
  if (cached) lock(cached);
  else rowEl.addEventListener('click', e => {
    const btn = e.target.closest('button.fb-btn');
    if (!btn || btn.disabled) return;
    if (readFeedback(key)) return;             // 一次性:已有值再点无效
    const entry = { v: btn.dataset.v, ts: new Date().toISOString() };
    try { localStorage.setItem(key, JSON.stringify(entry)); }
    catch (err) { note.textContent = '本地存储失败'; return; }
    lock(entry);                               // 不发任何后端请求(纯采集,留数据飞轮入口)
  });
  col.appendChild(rowEl);
  return rowEl;
}

// ===== ch05(T8): suggestions 帧 → 两个互不绑定的独立按钮(需求 8) =====
// 后端只发建议不代决策；转人工=纯前端模拟零 fetch；建工单=点下才 POST /api/tickets。
const TRANSFER_LINES = ['已转接人工客服', '您好，我是客服小猫，请问有什么可以帮您的'];
// ch06(T6): refund_apply 第三钮(固定四类原因表单);未知 action 兜底不渲染(需求面 P7)
const SUG_ICONS = { transfer_human: '🧑‍💼 ', create_ticket: '🎫 ', refund_apply: '🧾 ' };
function addSuggestionRow(col, items, userText, answerText) {
  const rowEl = document.createElement('div');
  rowEl.className = 'sug-row';
  const note = document.createElement('span');
  note.className = 'sug-note mono';
  note.textContent = '可以试试：';
  rowEl.appendChild(note);
  for (const it of items) {
    const icon = SUG_ICONS[it.action];
    if (!icon) continue;  // 未知 action 不渲染(ch05 兜底语义)
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn btn-sm sug-btn';
    b.textContent = icon + (it.label || '操作');
    b.addEventListener('click', async () => {
      if (b.disabled) return;
      if (it.action === 'refund_apply') {
        openRefundForm(col, b);   // ch06(T6): 轻表单,提交前不置灰(可反复开合)
      } else if (it.action === 'transfer_human') {
        b.disabled = true; b.classList.add('picked');       // 一次性；不碰另一个钮
        for (const line of TRANSFER_LINES)                  // 仅展示，不入 history=无隐藏动作
          addMessage('assistant', line);
      } else if (it.action === 'create_ticket') {
        if (conversationId == null) {
          addMessage('error', '⚠ 当前无服务端会话（数据库未启用），无法建工单');
          return;                                           // 失败不置灰,可重试
        }
        if (!confirm('确认创建工单？')) return;              // 确认后(计划钉死的交互)才发请求
        b.disabled = true;
        try {
          const resp = await fetch('/api/tickets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              conversation_id: conversationId,
              title: userText.slice(0, 100),
              content: '用户：' + userText + '\n客服：' + answerText,
            }),
          });
          const body = await resp.json().catch(() => null);
          if (!resp.ok) throw new Error((body && body.detail) || ('HTTP ' + resp.status));
          b.classList.add('picked');
          addMessage('assistant', '🎫 工单 ' + body.ticket_no + ' 已创建（会话 ' + conversationId + '）');
        } catch (err) {
          b.disabled = false;                               // 建单失败恢复可点
          addMessage('error', '⚠ 建工单失败：' + err.message);
        }
      }
    });
    rowEl.appendChild(b);
  }
  col.appendChild(rowEl);
  scrollBottom();
  return rowEl;
}

// ===== ch06(T6): orders 帧 → 像素风订单卡,点卡=回填协议句续跑(需求6/P5) =====
function addOrderCards(col, items) {
  const rowEl = document.createElement('div');
  rowEl.className = 'order-row';
  const group = [];
  for (const o of items) {
    const card = document.createElement('div');
    card.className = 'order-card';
    const id = document.createElement('div');
    id.className = 'oc-id';
    id.textContent = '订单 ' + o.order_id + ' · ' + o.status;
    const meta = document.createElement('div');
    meta.textContent = '¥' + Number(o.amount).toFixed(2) + (o.created_at ? ' · ' + o.created_at : '');
    const its = document.createElement('div');
    its.className = 'oc-items';
    its.textContent = (o.items || []).join('，');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn btn-sm order-pick-btn';
    btn.textContent = '选这个';
    btn.addEventListener('click', () => {
      if (sendBtn.disabled) return;   // 上一轮流未结束,忽略点击
      for (const g of group) { g.btn.disabled = true; g.card.classList.remove('picked'); }
      card.classList.add('picked');
      inputEl.value = '我选择订单 ' + o.order_id;  // 协议句(与后端正则逐字对齐)
      send();                          // 走既有流程:入 history、出 user 气泡
    });
    card.append(id, meta, its, btn);
    rowEl.appendChild(card);
    group.push({ card, btn });
  }
  col.appendChild(rowEl);
  scrollBottom();
}

// ===== ch06(T6): refund_apply → 固定四类原因轻表单(需求6/P6:原因不让用户自由填) =====
const REFUND_REASONS = ['七天无理由', '商品质量问题', '拍错多拍', '其他'];
function lastSelectedOrderId() {  // 预填=本会话最后一条选择协议句
  for (let i = history.length - 1; i >= 0; i--) {
    const m = history[i].role === 'user' && /^我选择订单\s*([0-9]{3,})$/.exec((history[i].content || '').trim());
    if (m) return m[1];
  }
  return '';
}
function openRefundForm(col, triggerBtn) {
  if (col.querySelector('.refund-form')) return;  // 已展开不重复
  if (conversationId == null) {
    addMessage('error', '⚠ 当前无服务端会话（数据库未启用），无法提交退款申请');
    return;                                        // 不置灰,可重试(Review Focus 5)
  }
  const form = document.createElement('form');
  form.className = 'refund-form';
  const idLabel = document.createElement('label');
  idLabel.append('单号 ');
  const idIn = document.createElement('input');
  idIn.name = 'order_id';
  idIn.required = true;
  idIn.pattern = '[0-9]{3,}';
  idIn.value = lastSelectedOrderId();
  idIn.placeholder = '如 1002';
  idLabel.appendChild(idIn);
  const rLabel = document.createElement('label');
  rLabel.append('原因 ');
  const sel = document.createElement('select');
  sel.required = true;
  for (const r of REFUND_REASONS) {
    const op = document.createElement('option');
    op.value = op.textContent = r;
    sel.appendChild(op);
  }
  rLabel.appendChild(sel);
  const bar = document.createElement('div');
  bar.className = 'refund-bar';
  const sub = document.createElement('button');
  sub.type = 'submit';
  sub.className = 'btn btn-sm sug-btn';
  sub.textContent = '提交退款申请';
  const can = document.createElement('button');
  can.type = 'button';
  can.className = 'btn btn-sm sug-btn';
  can.textContent = '取消';
  bar.append(sub, can);
  form.append(idLabel, rLabel, bar);
  can.addEventListener('click', () => form.remove());
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const oid = idIn.value.trim();
    if (!/^[0-9]{3,}$/.test(oid)) { addMessage('error', '⚠ 订单号需为至少 3 位数字'); return; }
    sub.disabled = true;
    try {
      const resp = await fetch('/api/refunds', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversation_id: conversationId, order_id: oid, reason: sel.value }),
      });
      const body = await resp.json().catch(() => null);
      if (!resp.ok) {
        const d = body && typeof body.detail === 'string' ? body.detail : ('HTTP ' + resp.status);
        throw new Error(d);
      }
      form.remove();
      triggerBtn.disabled = true;
      triggerBtn.classList.add('picked');
      addMessage('assistant', '🎫 退款申请 ' + body.ticket_no + ' 已提交（订单 ' + oid + '）');
    } catch (err) {
      sub.disabled = false;  // 失败可重试不锁死
      addMessage('error', '⚠ 退款申请提交失败：' + err.message);
    }
  });
  col.appendChild(form);
  scrollBottom();
}

// ===== ch04(T13) ③原文弹窗:GET /api/chunks/{id}(页面唯一新增请求面) =====
const citeOverlay = document.getElementById('cite-overlay');
const chunkCache = new Map();                  // spec §7-1:弹窗按 id 缓存
async function openCitation(cid) {
  const crumbs = document.getElementById('cite-breadcrumb');
  const qs = document.getElementById('cite-questions');
  const ans = document.getElementById('cite-answer');
  const prevB = document.getElementById('cite-prev');
  const nextB = document.getElementById('cite-next');
  citeOverlay.classList.add('open');
  crumbs.textContent = '加载中…'; qs.textContent = ''; ans.textContent = '（加载中…）';
  prevB.disabled = true; nextB.disabled = true;
  try {
    const k = String(cid);
    let c = chunkCache.get(k);
    if (!c) {
      const resp = await fetch('/api/chunks/' + encodeURIComponent(k));
      const body = await resp.json().catch(() => null);
      if (!resp.ok) throw new Error((body && body.detail) || ('HTTP ' + resp.status));
      c = body; chunkCache.set(k, c);
    }
    crumbs.textContent = c.category + ' > ' + c.section_path;   // 面包屑 category > section_path
    qs.textContent = (c.questions || '').split('\n').filter(Boolean).join(' ｜ ');
    ans.textContent = c.answer || '';
    prevB.disabled = !c.prev_chunk_id;
    nextB.disabled = !c.next_chunk_id;
    if (c.prev_chunk_id) prevB.onclick = () => openCitation(c.prev_chunk_id);  // 有则换发 cid 重开
    if (c.next_chunk_id) nextB.onclick = () => openCitation(c.next_chunk_id);
  } catch (err) {
    crumbs.textContent = '⚠ 原文获取失败:' + err.message;
  }
}
messagesEl.addEventListener('click', e => {    // 角标点击走事件委托(不逐泡挂监听)
  const sup = e.target.closest('sup.cite');
  if (sup) openCitation(sup.dataset.cid);
});
document.getElementById('cite-close').addEventListener('click', () => citeOverlay.classList.remove('open'));
citeOverlay.addEventListener('click', e => { if (e.target === citeOverlay) citeOverlay.classList.remove('open'); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && citeOverlay.classList.contains('open')) citeOverlay.classList.remove('open');
});

// ===== 售后提取弹窗：开/关 =====
function openExtract() {
  overlay.classList.add('open');
  document.getElementById('extract-input').focus();
}
function closeExtract() {
  overlay.classList.remove('open');
  inputEl.focus();
}
document.getElementById('extract-open-btn').addEventListener('click', openExtract);
document.getElementById('extract-close').addEventListener('click', closeExtract);
overlay.addEventListener('click', e => { if (e.target === overlay) closeExtract(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && overlay.classList.contains('open')) closeExtract();
});

// ===== 售后信息结构化提取（POST /api/extract，契约不变） =====
document.getElementById('extract-btn').addEventListener('click', async () => {
  const desc = document.getElementById('extract-input').value.trim();
  const out = document.getElementById('extract-result');
  const btn = document.getElementById('extract-btn');
  if (!desc) { out.textContent = '请先输入售后描述'; return; }
  out.textContent = '提取中…';
  btn.disabled = true;
  try {
    const resp = await fetch('/api/extract', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: desc }),
    });
    const body = await resp.json();
    out.textContent = JSON.stringify(body, null, 2);
  } catch (err) {
    out.textContent = '请求失败: ' + err.message;
  } finally {
    btn.disabled = false;
  }
});

// 初始欢迎语 + 自动聚焦;ch07(T10): 侧栏首帧拉列表(引擎未起=一行提示不挡聊天)
resetChat();
inputEl.focus();
loadConversations();
</script>
